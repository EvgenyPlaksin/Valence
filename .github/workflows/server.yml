name: Server

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".editorconfig"
      - "config/**"
      - "server/**"
      - "protocol/**"
      - ".github/workflows/server.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build