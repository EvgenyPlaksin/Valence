global
    maxconn 10000
    log stdout format raw local0

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

frontend valence
    bind :8080
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For 10.0.%[src_port,div(256)].%[src_port,mod(256)]
    default_backend ktor_nodes

backend ktor_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 500ms fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server node_a server:8081 check
    server node_b server-b:8081 check

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
