services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valence}
      POSTGRES_USER: ${POSTGRES_USER:-valence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.12.0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_CHANNEL_PREFIX: ${VALENCE_REDIS_CHANNEL_PREFIX:-valence:local}
    command:
      - sh
      - -c
      - |
        printf 'user default off\nuser valence on >%s &%s:* +publish +subscribe\n' "$$REDIS_PASSWORD" "$$REDIS_CHANNEL_PREFIX" > /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --save "" --appendonly no

  server:
    image: valence-server
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8081
      VALENCE_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-valence}
      VALENCE_DATABASE_USER: ${POSTGRES_USER:-valence}
      VALENCE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VALENCE_REDIS_URL: ${VALENCE_REDIS_URL:-redis://valence:${REDIS_PASSWORD}@redis:6379}
      VALENCE_REDIS_CHANNEL_PREFIX: ${VALENCE_REDIS_CHANNEL_PREFIX:-valence:local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${PORT:-8081}:8081"

volumes:
  postgres-data:
