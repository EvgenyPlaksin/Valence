services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valence}
      POSTGRES_USER: ${POSTGRES_USER:-valence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: valence-server
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8081
      VALENCE_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-valence}
      VALENCE_DATABASE_USER: ${POSTGRES_USER:-valence}
      VALENCE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8081}:8081"

volumes:
  postgres-data:
